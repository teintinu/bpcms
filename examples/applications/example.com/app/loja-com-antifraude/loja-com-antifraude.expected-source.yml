            "kind": "ServiceEntry"
            "alias": "Checkout"
            "ref": "w"
            "uri": "example.com/services/checkout"
          -
            "kind": "ServiceEntry"
            "alias": "FraudCheckout"
            "ref": "a6"
            "uri": "example.com/services/fraud-checkout"
          -
            "kind": "ServiceEntry"
            "alias": "Notifications"
            "ref": "b6"
            "uri": "example.com/services/notifications"
        "keyword": null
      -
        "kind": "Block"
        "name": "roles"
        "body":
          -
            "kind": "Statement"
            "statement":
              "kind": "ExpressionStatement"
              "expression":
                "kind": "MemberAccess"
                "name": "Customer"
                "object":
                  "kind": "Identifier"
                  "name": "Checkout"
          -
            "kind": "Statement"
            "statement":
              "kind": "ExpressionStatement"
              "expression":
                "kind": "MemberAccess"
                "name": "SupportAgent"
                "object":
                  "kind": "Identifier"
                  "name": "Checkout"
          -
            "kind": "Statement"
            "statement":
              "kind": "ExpressionStatement"
              "expression":
                "kind": "MemberAccess"
                "name": "RiskAnalyst"
                "object":
                  "kind": "Identifier"
                  "name": "FraudCheckout"
          -
            "kind": "Statement"
            "statement":
              "kind": "ExpressionStatement"
              "expression":
                "kind": "MemberAccess"
                "name": "RiskManager"
                "object":
                  "kind": "Identifier"
                  "name": "FraudCheckout"
          -
            "kind": "Statement"
            "statement":
              "kind": "ExpressionStatement"
              "expression":
                "kind": "Binary"
                "left":
                  "kind": "MemberAccess"
                  "name": "RiskManager"
                  "object":
                    "kind": "Identifier"
                    "name": "FraudCheckout"
                "op": ">"
                "right":
                  "kind": "MemberAccess"
                  "name": "RiskAnalyst"
                  "object":
                    "kind": "Identifier"
                    "name": "FraudCheckout"
        "keyword": null
      -
        "kind": "PropertyAssignment"
        "name": "theme"
        "value":
          "kind": "Identifier"
          "name": "Nuvula"
      -
        "kind": "PropertyAssignment"
        "name": "locales"
        "value":
          "kind": "List"
          "elements":
            -
              "kind": "Binary"
              "left":
                "kind": "Identifier"
                "name": "pt"
              "op": "-"
              "right":
                "kind": "Identifier"
                "name": "BR"
            -
              "kind": "Binary"
              "left":
                "kind": "Identifier"
                "name": "en"
              "op": "-"
              "right":
                "kind": "Identifier"
                "name": "US"
      -
        "kind": "PropertyAssignment"
        "name": "environments"
        "value":
          "kind": "List"
          "elements":
            -
              "kind": "Identifier"
              "name": "dev"
            -
              "kind": "Identifier"
              "name": "qa"
            -
              "kind": "Identifier"
              "name": "prod"
      -
        "kind": "Block"
        "name": "main"
        "body":
          -
            "kind": "Statement"
            "statement":
              "kind": "ExpressionStatement"
              "expression":
                "kind": "Identifier"
                "name": "start"
          -
            "kind": "Statement"
            "statement":
              "kind": "ExpressionStatement"
              "expression":
                "kind": "List"
                "elements":
                  -
                    "kind": "StringLiteral"
                    "value": "example.com/services/checkout"
                    "raw": "\"example.com/services/checkout\""
        "keyword": null
    "params": []
